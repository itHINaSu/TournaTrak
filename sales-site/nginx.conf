# Docker's embedded DNS, so the /demo/ upstream re-resolves per request
# instead of caching the demo nginx container's IP for the worker's life —
# see nginx/nginx.conf at the repo root for the reboot-502 story this fixes.
resolver 127.0.0.11 valid=10s ipv6=off;
map "" $demo_up { default "http://nginx:80"; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No directory listing
    autoindex off;

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self';" always;

    # Cache static assets aggressively
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Cache CSS/JS with short window so updates roll out quickly
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Live demo, reverse-proxied to the demo stack (compose.demo.yml) ──
    #
    # The demo app (frontend/ + api/, same code as production) is built to be
    # served at its own domain root: every asset, fetch() call, redirect, and
    # the service worker/manifest use root-relative paths like /api/session,
    # /style.css, /admin. None of that is aware of a URL prefix, so mounting
    # it under /demo/ needs the response bodies rewritten in flight, not just
    # a bare proxy_pass. `rewrite ... break` strips /demo before forwarding
    # the request; sub_filter puts the prefix back into whatever the demo
    # app's HTML/JS/CSS/manifest sends back, so browser-side requests for
    # "/api/..." or "/style.css" resolve back under /demo/ instead of hitting
    # this site's own root. proxy_redirect does the equivalent for the
    # server's redirect responses (e.g. res.redirect('/admin?...')), which
    # travel as a Location HEADER that sub_filter (body-only) cannot touch.
    #
    # Known gap: the service worker's precache list and push-notification
    # fallback URLs are a handful of paths hardcoded in frontend/sw.js itself
    # (not proxied text this rewrites) — offline/precache support may not be
    # fully correct under /demo/. Not fixed here: sw.js is shared with the
    # real production deploy, and this app is a throwaway sandbox that resets
    # every 30 minutes anyway (see compose.demo.yml), so "loads and works
    # while online" is the bar, not full PWA offline fidelity.
    location = /demo {
        return 301 /demo/;
    }

    # ^~ : stop here and skip the .css/.js cache-header regex location above
    # — regex locations win over a plain prefix match regardless of length,
    # so without this, a request for /demo/tt-common.js never reaches the
    # proxy below and 404s against this site's OWN static root instead.
    location ^~ /demo/ {
        rewrite ^/demo(/.*)$ $1 break;

        proxy_pass         $demo_up;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Force a plaintext response so sub_filter below can actually rewrite
        # it — otherwise the demo nginx's own `gzip on;` hands back
        # compressed bytes sub_filter can't see into.
        proxy_set_header   Accept-Encoding   "";

        # Rewrite Location headers from server-side redirects
        # (res.redirect('/admin?...'), etc.) — sub_filter only sees bodies.
        proxy_redirect / /demo/;

        sub_filter_types application/javascript text/javascript application/manifest+json application/json text/css;
        sub_filter_once off;

        # HTML attributes: <link href>, <script src>, <a href>.
        sub_filter 'href="/' 'href="/demo/';
        sub_filter 'src="/'  'src="/demo/';

        # No PWA on the demo (see the block below): rename the attribute
        # sw-register.js reads instead of rewriting its /demo/ path, so
        # dataset.sw comes back undefined and registration never fires.
        sub_filter 'data-sw="' 'data-tt-disabled-sw="';

        # CSS: @font-face src url(...)
        sub_filter 'url(/' 'url(/demo/';

        # JS: apiBase()/lineupApiBase()/scoreApiBase() in tt-common.js,
        # lineup.js, score.js all build every /api/... call from this one
        # returned literal.
        sub_filter "'/api'"    "'/demo/api'";
        sub_filter "'/api/t/'" "'/demo/api/t/'";

        # JS: bare-root navigation fallbacks ONLY — admin.js's slug-link
        # ternary and the admin.js/coach.js "go home" redirects. A blanket
        # "'/'" -> "'/demo/'" rule (the previous approach) also matches the
        # literal token '/'. anywhere it occurs in served JS, including
        # date formatting (month + '/' + day), name-splitting
        # (.split('/')[0]), and base64url decoding (.replace(/_/g, '/')) —
        # that corrupted dates like "7/15" into "7/demo/15". Keep these
        # narrow to the exact surrounding text of the real navigation sites.
        sub_filter ": '/';"      ": '/demo/';";      # admin.js: slug ? '/t/'+slug : '/'
        sub_filter ".href = '/';" ".href = '/demo/';"; # admin.js & coach.js "return to home"

        # JS: specific hardcoded client-side navigations that aren't built
        # from apiBase() (admin.js, bracket.js, builder.js, lineup.js, coach.js).
        sub_filter "'/admin'"          "'/demo/admin'";
        sub_filter "'/admin?tab="      "'/demo/admin?tab=";
        sub_filter "'/coach'"          "'/demo/coach'";
        sub_filter "'/coach?t='"       "'/demo/coach?t='";
        sub_filter "'/lineup'"         "'/demo/lineup'";
        sub_filter "'/lineup?t='"      "'/demo/lineup?t='";
        sub_filter "'/?v='"            "'/demo/?v='";
        sub_filter "'/?view=bracket'"  "'/demo/?view=bracket'";
        sub_filter "'/?view=schedule'" "'/demo/?view=schedule'";
        sub_filter "'/?view=teampath'" "'/demo/?view=teampath'";
        sub_filter "'/?view=buckets'"  "'/demo/?view=buckets'";

        # manifest.json / admin-manifest.json — both compact and
        # space-after-colon JSON serialization, since which one the server
        # emits isn't pinned here.
        sub_filter '"start_url":"/"'      '"start_url":"/demo/"';
        sub_filter '"start_url": "/"'     '"start_url": "/demo/"';
        sub_filter '"start_url":"/admin"'  '"start_url":"/demo/admin"';
        sub_filter '"start_url": "/admin"' '"start_url": "/demo/admin"';
        sub_filter '"scope":"/"'      '"scope":"/demo/"';
        sub_filter '"scope": "/"'     '"scope": "/demo/"';
        sub_filter '"src":"/icons'    '"src":"/demo/icons';
        sub_filter '"src": "/icons'   '"src": "/demo/icons';

        # Social-preview og:image (server-generated, absolute-URL-by-design —
        # see api/server.js getIndexHtml/buildIndexHtml).
        sub_filter '/pwa-icon.png"'          '/demo/pwa-icon.png"';
        sub_filter '/icons/trophy-512.png"'  '/demo/icons/trophy-512.png"';

        # No PWA on the demo, on purpose: it's a sandbox that resets every
        # DEMO_RESET_MINUTES (compose.demo.yml) — an installed icon pointing
        # at throwaway data, with no offline support anyway (see the sw.js
        # precache gap noted above this location), would just confuse
        # whoever tapped it later. Renaming rel="manifest" is enough on its
        # own to fail every browser's installability check (manifest +
        # registered service worker are both required); the data-sw rename
        # above additionally guarantees no service worker registration is
        # even attempted. Real tournament deployments are unaffected — this
        # only fires for responses proxied through /demo/.
        sub_filter 'rel="manifest"' 'rel="manifest-disabled"';

        # The admin login screen (frontend/admin.html) doesn't know it's the
        # public demo — it has no idea "demo / demo" is the account a visitor
        # should try. compose.demo.yml has said these credentials belong "on
        # the sales site / login screen" since it was written; put them on
        # the login screen itself here, rather than relying on someone
        # spotting them in a compose file comment. Anchored on unique prose
        # from the login overlay's explainer text, not a generic selector, so
        # it can't collide with anything else sub_filter touches above.
        sub_filter 'issued from here.' 'issued from here. This public demo logs in with <strong>demo</strong> / <strong>demo</strong>.';
    }
}
