# compose.demo.yml — public sandbox instance.
#
# A self-contained second stack for a "try it live" demo, isolated from the
# real tournament: its own data volume (./demo-files), its own port (3024),
# and DEMO_MODE so the API restores ./demo-seed every DEMO_RESET_MINUTES.
# Whatever a visitor changes is wiped back to the seed on the next reset.
#
# Run it alongside the real stack:
#   docker compose -f compose.demo.yml -p tournatrak-demo up -d --build
#
# Public credentials (printed on the sales site / login screen): demo / demo
#
# NOTE: the values below are deliberately public — this stack is a throwaway
# sandbox. Do NOT point it at real data or reuse the SESSION_SECRET elsewhere.

services:

  nginx:
    image: nginx:alpine
    ports:
      - 3024:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    # Run the container as the host user that owns ./demo-files so bind-mounted
    # data is written with matching ownership (avoids root-owned files the
    # node user can't overwrite). Defaults to 1000:1000 — override by setting
    # PUID/PGID in your shell or .env, e.g. `PUID=1001 PGID=1001`.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./demo-files:/data:ro       # legacy JSON import source only (usually empty)
      - ./demo-seed:/seed:ro        # canonical demo state, restored on reset
      - ./frontend:/frontend:ro
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "false"
      # Demo-only secret. ≥32 chars, public on purpose — never reuse in prod.
      SESSION_SECRET: "tournatrak-public-demo-sandbox-secret-0000000000"
      ADMIN_USERNAME: "demo"
      # bcrypt hash of "demo" (matches demo-seed/users.json, which wins anyway).
      # Each literal "$" is doubled to "$$" — Compose treats a single "$" as a
      # variable reference in inline environment values.
      ADMIN_PASSWORD_HASH: "$$2a$$12$$o8TRdSgRMSRO5k1h2YACL.pyDMMr2IauD7wZ/vb4N/KkoZLN9OXua"
      FORCE_PASSWORD_CHANGE: "false"
      DEMO_MODE: "true"
      DEMO_SEED_DIR: "/seed"
      DEMO_RESET_MINUTES: "30"
      # Demo-only database credentials — internal to this compose network.
      # Discrete PG* vars (not DATABASE_URL) so the password needs no URL-encoding.
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: tournatrak
      PGDATABASE: tournatrak
      PGPASSWORD: "tournatrak-demo"

  postgres:
    image: postgres:16-alpine
    # No ports/expose to the host — reachable only on the compose network.
    environment:
      POSTGRES_USER: tournatrak
      POSTGRES_DB: tournatrak
      POSTGRES_PASSWORD: "tournatrak-demo"
    volumes:
      # A NAMED volume here on purpose, unlike the real stack (which uses
      # ./pgdata so `down -v` can't destroy a tournament). The demo is a
      # sandbox reset from demo-seed/ — throwing it away with `down -v` is a
      # feature, not the accident it would be in production.
      - demo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournatrak -d tournatrak"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  demo-pgdata:
