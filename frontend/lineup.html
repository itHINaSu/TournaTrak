<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Team Lineup</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="admin.css">
<link rel="stylesheet" href="lineup.css">
<script>document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');</script>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="header-name-block">
    <h1 id="siteName">Team Lineup</h1>
  </div>
  <div class="header-controls">
    <button class="theme-toggle" id="themeToggle">☀ Light</button>
  </div>
</header>

<nav id="lineupNav" style="display:none"></nav>

<div id="lineupInvalid" style="display:none" class="lineup-state">
  <div class="lineup-state-icon">🔗</div>
  <div class="lineup-state-title">Link Invalid or Expired</div>
  <div class="lineup-state-body">This access link is no longer valid. Contact your tournament administrator for a new link.</div>
</div>

<div id="lineupLoading" class="lineup-state">
  <div class="lineup-state-body">Loading…</div>
</div>

<div id="lineupContent" style="display:none" class="lineup-wrap">
  <div class="lineup-team-header">
    <div class="lineup-team-label">Team</div>
    <div id="lineupTeamName" class="lineup-team-name"></div>
  </div>

  <!-- Two-column selector row: team (left) + game (right) -->
  <div id="lineupSelectorsRow" class="lineup-selectors-row" style="display:none">
    <div class="lineup-game-info lineup-sel-half">
      <select id="lineupTeamSel" class="lineup-game-sel"></select>
    </div>
    <div class="lineup-game-info lineup-sel-half" id="lineupGameInfo">
      <span class="lineup-game-sel-placeholder" id="lineupGamePlaceholder">Select a team first</span>
      <select id="lineupGameSelect" class="lineup-game-sel" style="display:none"></select>
    </div>
  </div>

  <div id="lineupReadOnlyBadge" style="display:none" class="lineup-readonly-badge">
    View Only — Game Complete
  </div>

  <div id="lineupNoGame" style="display:none" class="lineup-no-game">
    No upcoming games scheduled for your team.
  </div>

  <!-- Import modal -->
  <div id="lineupImportOverlay" class="lineup-modal-overlay" style="display:none" onclick="closeImport(event)">
    <div class="lineup-modal" onclick="event.stopPropagation()">
      <div class="lineup-modal-title">Import Lineup</div>
      <div class="lineup-modal-body">
        <div class="lineup-modal-label">Copy lineup from:</div>
        <select id="lineupImportSel" class="lineup-modal-sel"></select>
      </div>
      <div class="lineup-modal-footer">
        <button class="lineup-tool-btn" onclick="confirmImport()">Import</button>
        <button class="lineup-tool-btn lineup-tool-btn--cancel" onclick="closeImport()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="lineup-form-wrap">
    <div class="lineup-tools" id="lineupTools" style="display:none">
      <button class="lineup-tool-btn lineup-tool-btn--import" id="lineupImportBtn" onclick="openImport()">Import Lineup</button>
      <button class="lineup-tool-btn lineup-tool-btn--right lineup-tool-btn--reorder" id="lineupReorderBtn" onclick="toggleReorder()">Reorder</button>
    </div>
    <table class="lineup-table">
      <thead>
        <tr>
          <th class="lineup-th lineup-th--order"></th>
          <th class="lineup-th lineup-th--num">#</th>
          <th class="lineup-th lineup-th--name">Player Name</th>
          <th class="lineup-th lineup-th--pos">Position</th>
        </tr>
      </thead>
      <tbody id="lineupBody"></tbody>
    </table>
    <div class="lineup-actions">
      <button class="lineup-submit-btn" id="lineupSubmitBtn" onclick="submitLineup()">Save Lineup</button>
      <button class="lineup-sub-add-btn" id="lineupAddSubBtn" onclick="addSubRow()" style="display:none">Add Subs</button>
      <button class="lineup-sub-del-btn" id="lineupDelSubBtn" onclick="deleteSubRow()" style="display:none">Delete Sub</button>
      <span class="lineup-status" id="lineupStatus"></span>
    </div>
  </div>
</div>

<script src="tt-common.js"></script>
<script src="bracket-data.js"></script>
<script src="lineup.js"></script>
</body>
</html>
