<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scorekeeper</title>
<meta name="theme-color" content="#0f1410" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f0f4f1" media="(prefers-color-scheme: light)">
<link rel="icon" href="/icons/trophy-192.png" type="image/png">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/base.css?v=3.97">
<link rel="stylesheet" href="/score.css?v=3.97">
<script src="/app-h.js?v=3.97"></script>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="header-name-block">
    <h1 id="scoreSiteName">Scorekeeper</h1>
  </div>
  <!-- Below the desktop breakpoint the controls collapse behind this, exactly
       as on the public bracket. Without it the stylesheet still gave
       .header-controls the dropdown-panel treatment, so the menu sat open on
       top of the page with no way to shut it. -->
  <button class="header-menu-btn" id="headerMenuBtn" data-action="toggleHeaderMenu"
          aria-label="Menu" aria-expanded="false" aria-controls="headerControls" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </button>
  <div class="header-controls" id="headerControls">
    <a href="/admin" class="admin-public-btn">Admin</a>
    <button class="admin-public-btn" id="themeToggle">Dark Mode</button>
  </div>
</header>

<!-- Shown until the session check passes with a results/admin role -->
<div class="score-gate" id="scoreGate" hidden>
  <div class="score-gate-box">
    <div class="score-gate-title">Sign in required</div>
    <div class="score-gate-desc">Scorekeeper mode needs a results or admin account.</div>
    <a class="score-btn score-btn--primary" href="/admin">Sign in at Admin</a>
  </div>
</div>

<main class="score-wrap" id="scoreWrap" hidden>
  <div class="score-field-bar" id="fieldBar"></div>
  <!-- Quick "running late" row, opened from the chip in the field bar. Scoped
       to whichever field is filtered (or all of them). -->
  <div class="score-offset-row" id="offsetRow" hidden></div>
  <div class="score-list" id="gameList"></div>
</main>

<div class="toast" id="toast"></div>

<script src="/settings-defaults.js?v=3.97"></script>
<script src="/theme-css.js?v=3.97"></script>
<script src="/tt-common.js?v=3.97"></script>
<script src="/bracket-data.js?v=3.97"></script>
<script src="/score.js?v=3.97"></script>
</body>
</html>
