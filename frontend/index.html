<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tournament Bracket</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f1410" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f0f4f1" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="/icons/trophy-180.png">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="bracket.css">
<script>document.documentElement.style.setProperty('--app-h', window.innerHeight + 'px');</script>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="header-name-block">
    <h1 id="siteName">Tournament Bracket</h1>
    <div id="siteSubtitle" class="site-subtitle"></div>
  </div>
  <div class="header-controls">
    <button class="admin-public-btn" id="bucketEditBtn" style="display:none" onclick="enterBucketEdit()">Edit</button>
    <a href="/lineup" class="admin-public-btn" id="lineupPortalBtn" style="display:none">Lineup →</a>
    <a href="/admin" class="admin-public-btn" id="adminPortalBtn" style="display:none">Admin →</a>
    <button class="theme-toggle" id="themeToggle">☀ Light</button>
  </div>
</header>

<div class="update-bar" id="updateBar" style="display:none">
  <span id="updateBarText"></span>
</div>

<div class="view-tabs" id="viewTabs">
  <div class="view-tab active" data-view="bracket">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="6" height="4" rx="1"/><rect x="2" y="10" width="6" height="4" rx="1"/>
      <rect x="9" y="6" width="6" height="4" rx="1"/>
      <rect x="16" y="8" width="6" height="4" rx="1"/>
      <line x1="8" y1="5" x2="9" y2="5"/><line x1="8" y1="12" x2="9" y2="12"/>
      <line x1="9" y1="5" x2="9" y2="12"/><line x1="15" y1="8" x2="16" y2="8"/>
    </svg>
    <span class="tab-label">Bracket</span>
  </div>
  <div class="view-tab" data-view="schedule">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
      <line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="13" y2="18"/>
    </svg>
    <span class="tab-label">Schedule</span>
  </div>
  <div class="view-tab" data-view="teampath">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="7" r="3"/><circle cx="17" cy="8" r="2.5"/>
      <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
      <path d="M17 14c2.2.5 4 2.5 4 5"/>
    </svg>
    <span class="tab-label">Team Path</span>
  </div>
  <div class="view-tab" data-view="buckets">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 5Q12 2 15 5"/>
      <line x1="4" y1="7" x2="20" y2="7"/>
      <path d="M4 7l2.5 14h11L20 7"/>
    </svg>
    <span class="tab-label">Buckets</span>
  </div>
</div>

<div class="view-panel active" id="view-bracket">
  <div id="bracketRoot"></div>
</div>

<div class="view-panel" id="view-schedule">
  <div class="selector-row">
    <div class="selector-inner">
      <label>Round</label>
      <select class="styled" id="roundSelect">
        <option value="R1">Round 1</option>
        <option value="R2">Round 2</option>
        <option value="QF">Quarter Finals</option>
        <option value="QF2">Quarter Finals 2</option>
        <option value="SF">Semi Finals</option>
        <option value="CHAMP">Championship</option>
      </select>
    </div>
  </div>
  <div class="round-panel" id="roundGames"></div>
</div>

<div class="view-panel" id="view-teampath">
  <div class="selector-row">
    <div class="selector-inner">
      <label>Team</label>
      <select class="styled" id="teamSelect">
        <option value="">— select a team —</option>
      </select>
    </div>
  </div>
  <div class="team-panel" id="teamOut"></div>
</div>

<div class="view-panel" id="view-buckets">
  <div class="bucket-frozen" id="bucketTop3"></div>
  <div class="bucket-panel" id="bucketOut"></div>
</div>

<div class="toast" id="toast"></div>

<script src="bracket-data.js"></script>
<script src="bracket.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
</body>
</html>
