<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tournament Bracket</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f1410" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f0f4f1" media="(prefers-color-scheme: light)">
<link rel="apple-touch-icon" href="/icons/trophy-180.png">
<link rel="icon" href="/icons/trophy-tab-192.png" type="image/png">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/base.css?v=3.23">
<link rel="stylesheet" href="/bracket.css?v=3.23">
<script src="/app-h.js?v=3.23"></script>
</head>
<body>

<header class="site-header" id="siteHeader">
  <img id="siteLogo" class="site-logo" alt="" hidden>
  <div class="header-name-block">
    <h1 id="siteName">Tournament Bracket</h1>
    <div id="siteSubtitle" class="site-subtitle"></div>
  </div>
  <div class="header-controls">
    <button class="admin-public-btn" id="projectToggleBtn" hidden data-action="toggleProject">Project winners</button>
    <button class="admin-public-btn" id="shareImageBtn" hidden data-action="openShareImage" title="Save the bracket as an image">Save image</button>
    <button class="admin-public-btn" id="bracketEditBtn" hidden data-action="toggleBracketEdit">Edit</button>
    <button class="admin-public-btn" id="bucketEditBtn" hidden data-action="enterBucketEdit">Edit</button>
    <a href="/lineup" class="admin-public-btn" id="lineupPortalBtn" hidden>Lineup →</a>
    <a href="/admin" class="admin-public-btn" id="adminPortalBtn" hidden>Admin →</a>
    <button class="theme-toggle" id="themeToggle">☀ Light</button>
  </div>
</header>

<div class="offline-notice" id="offlineNotice" hidden>Offline — showing last loaded data</div>
<div class="update-bar" id="updateBar" hidden>
  <span id="updateBarText"></span>
</div>

<div class="delay-notice" id="delayNotice" hidden>
  <span id="delayNoticeText"></span>
</div>

<div class="view-tabs" id="viewTabs">
  <div class="view-tab active" data-view="bracket">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="3" width="6" height="4" rx="1"/><rect x="2" y="10" width="6" height="4" rx="1"/>
      <rect x="9" y="6" width="6" height="4" rx="1"/>
      <rect x="16" y="8" width="6" height="4" rx="1"/>
      <line x1="8" y1="5" x2="9" y2="5"/><line x1="8" y1="12" x2="9" y2="12"/>
      <line x1="9" y1="5" x2="9" y2="12"/><line x1="15" y1="8" x2="16" y2="8"/>
    </svg>
    <span class="tab-label">Bracket</span>
  </div>
  <div class="view-tab" data-view="schedule">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
      <line x1="8" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="13" y2="18"/>
    </svg>
    <span class="tab-label">Schedule</span>
  </div>
  <div class="view-tab" data-view="teampath">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="7" r="3"/><circle cx="17" cy="8" r="2.5"/>
      <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
      <path d="M17 14c2.2.5 4 2.5 4 5"/>
    </svg>
    <span class="tab-label">Team Path</span>
  </div>
  <div class="view-tab" data-view="buckets">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 5Q12 2 15 5"/>
      <line x1="4" y1="7" x2="20" y2="7"/>
      <path d="M4 7l2.5 14h11L20 7"/>
    </svg>
    <span class="tab-label">Buckets</span>
  </div>
  <!-- Shares the fourth slot with Buckets; settings.fourthTab picks which
       one is shown (applyFourthTab in bracket.js). -->
  <div class="view-tab" data-view="standings" hidden>
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="20" x2="20" y2="20"/>
      <rect x="5" y="12" width="4" height="8"/>
      <rect x="10" y="7" width="4" height="13"/>
      <rect x="15" y="15" width="4" height="5"/>
    </svg>
    <span class="tab-label">Standings</span>
  </div>
</div>

<div class="view-panel active" id="view-bracket">
  <!-- Open/A/B flight switcher — shown only for tiered tournaments -->
  <div class="bracket-flights" id="bracketFlights" hidden>
    <button class="flight-pill active" data-action="setFlight" data-arg="open">Open</button>
    <button class="flight-pill" data-action="setFlight" data-arg="A">A Bracket</button>
    <button class="flight-pill" data-action="setFlight" data-arg="B">B Bracket</button>
  </div>
  <div class="share-overlay" id="shareOverlay" hidden>
    <div class="share-box">
      <div class="share-title">Save bracket image</div>
      <div class="share-opts">
        <label class="share-opt"><input type="checkbox" id="shareResults" checked data-action-change="refreshShareImage"> Include scores and winners</label>
      </div>
      <div class="share-opts share-themes">
        <label class="share-opt"><input type="radio" name="shareTheme" value="dark" checked data-action-change="refreshShareImage"> Dark</label>
        <label class="share-opt"><input type="radio" name="shareTheme" value="light" data-action-change="refreshShareImage"> Light</label>
        <label class="share-opt"><input type="radio" name="shareTheme" value="print" data-action-change="refreshShareImage"> Print <span class="share-opt-note">(white, minimal ink)</span></label>
      </div>
      <div class="share-preview-wrap"><img id="sharePreview" class="share-preview" alt="Bracket image preview"></div>
      <div class="share-actions">
        <button class="admin-clear-btn" data-action="closeShareImage">Cancel</button>
        <button class="flight-pill share-dl" data-action="downloadShareImage">Download PNG</button>
      </div>
      <div class="share-hint" id="shareHint"></div>
    </div>
  </div>
  <!-- Bracket Edit: drag a card onto an empty row to place it by hand. A
       moved card is pinned to that row, which is what makes editing useful
       on the losers side (its automatic layout ignores slot numbers). -->
  <div class="project-bar" id="bracketEditBar" hidden>
    <button class="project-clear" id="bracketResetBtn" type="button" data-action="resetBracketLayout">Reset layout</button>
    <span class="project-hint">Drag a card onto an empty row to move it — cards you move stay where you put them</span>
  </div>
  <!-- Project winners: admin-only what-if picks (toggle lives in the header
       next to Edit); nothing is saved or sent. This bar carries the hint and
       the clear button while a projection is active. -->
  <div class="project-bar" id="projectBar" hidden>
    <button class="project-clear" id="projectClearBtn" type="button" data-action="clearProjections" hidden>Clear picks</button>
    <span class="project-hint" id="projectHint" hidden>Tap a team to pick a winner — picks are only on this device and reset on reload</span>
  </div>
  <div id="bracketRoot"></div>
</div>

<div class="view-panel" id="view-schedule">
  <!-- Open/A/B flight switcher — shown only for tournaments with drop brackets -->
  <div class="bracket-flights sched-flights" id="scheduleFlights" hidden>
    <button class="flight-pill active" data-action="setSchedFlight" data-arg="open">Open</button>
    <button class="flight-pill" data-action="setSchedFlight" data-arg="A">A Bracket</button>
    <button class="flight-pill" data-action="setSchedFlight" data-arg="B">B Bracket</button>
  </div>
  <div class="selector-row">
    <div class="selector-inner sched-selector-inner">
      <div class="sched-select-wrap sched-select-wrap--group">
        <select class="styled sched-select" id="schedGroup">
          <optgroup label="Group by">
            <option value="day">Day</option>
            <option value="round">Round</option>
            <option value="field">Field</option>
          </optgroup>
        </select>
      </div>
      <div class="sched-select-wrap sched-select-wrap--view">
        <select class="styled sched-select" id="schedSection">
          <option value="">—</option>
        </select>
      </div>
    </div>
  </div>
  <div class="round-panel" id="roundGames"></div>
</div>

<div class="view-panel" id="view-teampath">
  <div class="selector-row">
    <div class="selector-inner">
      <label>Team</label>
      <select class="styled" id="teamSelect">
        <option value="">— select a team —</option>
      </select>
      <button class="team-share-btn" id="teamShareBtn" title="Copy shareable link" hidden>Share</button>
    </div>
  </div>
  <div class="team-panel" id="teamOut"></div>
</div>

<div class="view-panel" id="view-buckets">
  <div class="bucket-frozen" id="bucketTop3"></div>
  <div class="bucket-panel" id="bucketOut"></div>
</div>

<div class="view-panel" id="view-standings">
  <div class="team-panel" id="standingsOut"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/settings-defaults.js?v=3.23"></script>
<script src="/tt-common.js?v=3.23"></script>
<script src="/bracket-data.js?v=3.23"></script>
<script src="/bracket.js?v=3.23"></script>
<script src="/sw-register.js?v=3.23" data-sw="/sw.js"></script>
</body>
</html>
