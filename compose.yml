services:

  nginx:
    image: nginx:alpine
    ports:
      - "3019:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    # Run the container as the host user that owns ./files so bind-mounted
    # data is written with matching ownership (avoids root-owned files the
    # node user can't overwrite). Defaults to 1000:1000 — override by setting
    # PUID/PGID in your shell or .env, e.g. `PUID=1001 PGID=1001`.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - ./files:/data
      - ./frontend:/frontend:ro
    restart: unless-stopped
    expose:
      - "3000"
    # ── Environment ────────────────────────────────────────────────────────
    # Copy the example file and fill in real values before first run:
    #   mv .env.example .env
    # Then edit .env with your SESSION_SECRET, password hash, etc.
    env_file: ./.env
