services:

  # First-boot secret generation: creates random pg_password / session_secret
  # in ./secrets if missing (values from .env win when provided),
  # then exits. Runs before postgres and the API. Makes a bare
  # `git clone && docker compose up -d --build` a complete, secure install.
  secrets-init:
    image: alpine:3.20
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - ./secrets:/run/tt-secrets
    command:
      - /bin/sh
      - -ec
      - |
        cd /run/tt-secrets
        gen() { head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; }
        if [ ! -s pg_password ]; then
          if [ -n "$$POSTGRES_PASSWORD" ]; then printf '%s' "$$POSTGRES_PASSWORD" > pg_password;
          else gen > pg_password; echo "generated pg_password"; fi
        fi
        if [ ! -s session_secret ]; then
          if [ -n "$$SESSION_SECRET" ]; then printf '%s' "$$SESSION_SECRET" > session_secret;
          else gen > session_secret; echo "generated session_secret"; fi
        fi
        chown -R "$$PUID:$$PGID" /run/tt-secrets
        chmod 700 /run/tt-secrets
        chmod 600 ./*

  nginx:
    image: nginx:alpine
    ports:
      # Host port for the public site. Override per-machine by putting
      # TT_PORT=3029 in .env (gitignored) rather than editing this line —
      # a local edit here conflicts on every pull, and `git pull` then stops
      # with "Your local changes would be overwritten".
      - "${TT_PORT:-3019}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    # Run the container as the host user that owns ./files so bind-mounted
    # data is written with matching ownership (avoids root-owned files the
    # node user can't overwrite). Defaults to 1000:1000 — override by setting
    # PUID/PGID in your shell or .env, e.g. `PUID=1001 PGID=1001`.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      # /data is only read now (one-time legacy JSON import on first boot
      # against an empty database); persistence lives in Postgres.
      - ./files:/data:ro
      - ./frontend:/frontend:ro
      - ./secrets:/run/tt-secrets
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      # Discrete PG* vars instead of a DATABASE_URL: pg reads these natively,
      # so the password never passes through URL parsing and may contain any
      # characters (a base64 secret with '/', '+', '=' broke the URL form).
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: tournatrak
      PGDATABASE: tournatrak
      # Falls back to the generated /run/tt-secrets/pg_password when unset
      # (see api/entrypoint.sh); same for SESSION_SECRET / ADMIN_PASSWORD_HASH.
      PGPASSWORD: "${POSTGRES_PASSWORD:-}"
    # .env is OPTIONAL: with no .env at all, secrets are generated on first
    # boot (see secrets-init + api/entrypoint.sh) and the initial admin
    # password is printed in `docker compose logs api`. Create .env only to
    # override defaults (see .env.example).
    env_file:
      - path: ./.env
        required: false

  postgres:
    image: postgres:16-alpine
    # No ports/expose to the host — reachable only on the compose network.
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: tournatrak
      POSTGRES_DB: tournatrak
      # Read from the generated (or .env-seeded) secret file. NOTE: postgres
      # bakes this into pgdata on FIRST init; see .env.example.
      POSTGRES_PASSWORD_FILE: /run/tt-secrets/pg_password
    volumes:
      # HOST DIRECTORY, not a named volume. `docker compose down -v` removes
      # named volumes, and that is a normal thing to reach for when a stack
      # misbehaves — it took a live tournament with it once. A bind mount is
      # outside Docker's volume lifecycle, so `down -v` cannot touch it and
      # the database is a directory you can see, back up and copy.
      - ./pgdata:/var/lib/postgresql/data
      - ./secrets:/run/tt-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournatrak -d tournatrak"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

# No named volumes. Everything durable lives in host directories next to this
# file — ./pgdata (the database), ./secrets (generated passwords) and ./files
# (legacy JSON, read-only). All are gitignored. That is what makes
# `docker compose down -v` safe here: it removes named volumes, and there are
# none left to remove.
#
# ./secrets moved out of a named volume WITH the database on purpose. The
# password Postgres was initialised with lives there, so keeping the data but
# regenerating the secret would leave the API unable to log in to its own
# database — the two have to survive or be replaced together.
