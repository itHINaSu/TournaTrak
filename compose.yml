services:

  nginx:
    image: nginx:alpine
    ports:
      - "3019:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    volumes:
      - ./files:/data
      - ./frontend:/frontend:ro
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    # ── Environment ────────────────────────────────────────────────────────
    # Copy the example file and fill in real values before first run:
    #   mv .env.example .env
    # Then edit .env with your SESSION_SECRET, DB_PASSWORD, and password hash.
    #
    # DATABASE_URL is constructed here from DB_PASSWORD so it only needs to
    # be set in one place. To use an external database instead, override
    # DATABASE_URL directly here and remove the db service and depends_on.
    env_file: ./.env
    environment:
      DATABASE_URL: postgres://tournatrak:${DB_PASSWORD}@db:5432/tournatrak

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       tournatrak
      POSTGRES_USER:     tournatrak
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tournatrak -d tournatrak"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
