services:

  nginx:
    image: nginx:alpine
    ports:
      - "3018:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    volumes:
      - ./files:/data
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      # Generate a long random string (e.g. openssl rand -hex 32)
      - SESSION_SECRET=CHANGEME_replace_with_at_least_32_random_chars
      - ADMIN_USERNAME=admin
      # Hash of "TournaTrak" (bcrypt cost 12). Login: admin / TournaTrak
      # Replace with your own: docker compose run --rm api node generate-hash.js yourpassword
      - ADMIN_PASSWORD_HASH=$2a$12$PlNaqDDGAJCZTN4yjqDLpu90aOIvNfV2JCp90F3yHcH4ifi3RxBZC
      # Set to true to force a password change on first login (default for new deployments).
      # See .env.example for the quickstart flow.
      - FORCE_PASSWORD_CHANGE=false
