services:

  nginx:
    image: nginx:alpine
    ports:
      - "3018:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    volumes:
      - ./files:/data
    restart: unless-stopped
    expose:
      - "3000"
    # ── Environment ────────────────────────────────────────────────────────
    # Copy the example file and fill in real values before first run:
    #   mv .env.example .env
    # Then edit .env with your SESSION_SECRET, password hash, etc.
    env_file: ./.env
