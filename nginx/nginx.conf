events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Sec-Fetch-Dest is set to "document" when a user navigates directly to a
    # URL in the browser. Sub-resource loads (stylesheet, script, font, image)
    # send a different value. We use this to block direct browsing to raw files.
    map $http_sec_fetch_dest $is_direct_nav {
        "document"  1;
        default     0;
    }

    gzip            on;
    gzip_types      text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    upstream api {
        server api:3000;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;" always;

        # Proxy API calls to Node container
        location /api/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Root — proxied to API so it can inject dynamic title + og:title
        # for social link preview scrapers that don't execute JavaScript.
        location = / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /index.html {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Admin page — HAProxy restricts by src IP before this is hit
        location = /admin {
            try_files /admin.html =404;
        }

        location = /admin.html {
            try_files $uri =404;
        }

        # Lineup page — served to coaches via magic-link redirect
        location = /lineup {
            try_files /lineup.html =404;
        }

        # Service worker files — no-cache so updates are picked up immediately.
        # Service-Worker-Allowed: / lets the SW control the full origin scope.
        location ~* sw\.js$ {
            add_header Service-Worker-Allowed /;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # PWA manifests — short-lived cache, never block direct navigation.
        location ~* manifest\.json$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Block direct browser navigation to raw source files.
        # Sub-resource loads (Sec-Fetch-Dest: style/script/font/…) are allowed.
        location ~* \.(css|js|map)$ {
            if ($is_direct_nav) {
                return 403;
            }
            try_files $uri =404;
        }

        # Everything else — SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
