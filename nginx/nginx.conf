events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Sec-Fetch-Dest is set to "document" when a user navigates directly to a
    # URL in the browser. Sub-resource loads (stylesheet, script, font, image)
    # send a different value. We use this to block direct browsing to raw files.
    map $http_sec_fetch_dest $is_direct_nav {
        "document"  1;
        default     0;
    }

    gzip            on;
    gzip_types      text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    upstream api {
        server api:3000;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # script-src is 'self' only: all JS is in external files and event
        # handlers use the data-action delegation in tt-common.js — do not
        # reintroduce inline <script> or onclick= attributes.
        # style-src still needs 'unsafe-inline' for generated style="" attrs;
        # tightening it is tracked as a follow-up refactor.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;" always;

        # Proxy API calls to Node container
        location /api/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Root — proxied to API so it can inject dynamic title + og:title
        # for social link preview scrapers that don't execute JavaScript.
        location = / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /index.html {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Multi-tournament public bracket page routes — same dynamic-title/OG
        # treatment as / above. Covers the default tournament's four bare tab
        # paths (/bracket /schedule /teampath /buckets) and any /t/:slug
        # tournament plus its four tab paths. Must come before the generic
        # SPA fallback below so these don't just serve the static index.html
        # (which would work client-side but skip the per-tournament OG tags).
        location ~ ^/(bracket|schedule|teampath|buckets)$ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location ~ ^/t/[a-z0-9][a-z0-9-]{0,62}(/(bracket|schedule|teampath|buckets))?$ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Admin page — access controlled by session auth (API routes require a
        # valid session; the page itself shows a login overlay until authenticated).
        location = /admin {
            try_files /admin.html =404;
        }

        location = /admin.html {
            try_files $uri =404;
        }

        # Bracket Builder — admin tool (same session-auth model as /admin).
        location = /builder {
            try_files /builder.html =404;
        }

        location = /builder.html {
            try_files $uri =404;
        }

        # Lineup page — served to coaches via magic-link redirect
        location = /lineup {
            try_files /lineup.html =404;
        }

        # Service worker files — no-cache so updates are picked up immediately.
        # Service-Worker-Allowed: / lets the SW control the full origin scope.
        location ~* sw\.js$ {
            add_header Service-Worker-Allowed /;
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # PWA manifests — short-lived cache, never block direct navigation.
        location ~* manifest\.json$ {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        # Block direct browser navigation to raw source files.
        # Sub-resource loads (Sec-Fetch-Dest: style/script/font/…) are allowed.
        location ~* \.(css|js|map)$ {
            if ($is_direct_nav) {
                return 403;
            }
            try_files $uri =404;
        }

        # Everything else — SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
