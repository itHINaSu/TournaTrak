events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream api {
        server api:3000;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Proxy API calls to Node container
        location /api/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Root — proxied to API so it can inject dynamic title + og:title
        # for social link preview scrapers that don't execute JavaScript.
        location = / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /index.html {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Admin page — HAProxy restricts by src IP before this is hit
        location = /admin {
            try_files /admin.html =404;
        }

        location = /admin.html {
            try_files $uri =404;
        }

        # Lineup page — served to coaches via magic-link redirect
        location = /lineup {
            try_files /lineup.html =404;
        }

        # Everything else — SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
