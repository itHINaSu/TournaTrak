events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Sec-Fetch-Dest is set to "document" when a user navigates directly to a
    # URL in the browser. Sub-resource loads (stylesheet, script, font, image)
    # send a different value. We use this to block direct browsing to raw files.
    map $http_sec_fetch_dest $is_direct_nav {
        "document"  1;
        default     0;
    }

    gzip            on;
    gzip_types      text/css application/javascript application/json;
    gzip_min_length 1024;

    upstream api {
        server api:3000;
    }

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # script-src is 'self' only: all JS is in external files and event
        # handlers use the data-action delegation in tt-common.js — do not
        # reintroduce inline <script> or onclick= attributes.
        # style-src is fully locked down: no inline style attributes anywhere.
        # Generated markup uses data-css + the tt-common.js observer (CSSOM
        # assignment, which CSP permits); static visibility uses the hidden
        # attribute. Do not reintroduce style="" attrs or <style> blocks.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:;" always;

        # Proxy API calls to Node container.
        #
        # client_max_body_size: nginx defaults to 1m, which SILENTLY 413s a
        # fully branded POST /api/theme-colors before it ever reaches Node —
        # that body carries the header logo, the baked app icon, its
        # high-res source, the tab icon and its source as data URIs. Keep in
        # step with the express.json limit on that route in server.js.
        location /api/ {
            client_max_body_size 2m;
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Root — proxied to API so it can inject dynamic title + og:title
        # for social link preview scrapers that don't execute JavaScript.
        location = / {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /index.html {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Multi-tournament public bracket page routes — same dynamic-title/OG
        # treatment as / above. Covers the default tournament's bare tab paths
        # (/bracket /schedule /teampath /buckets /standings) and any /t/:slug
        # tournament plus its tab paths. Buckets and standings share the
        # fourth tab slot — only one is shown at a time (settings.fourthTab) —
        # but both paths stay routable. Must come before the generic SPA
        # fallback below so these don't just serve the static index.html
        # (which would work client-side but skip the per-tournament OG tags).
        location ~ "^/(bracket|schedule|teampath|buckets|standings)$" {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Quoted: the {0,62} brace quantifier would otherwise be parsed as a
        # config block delimiter ("unknown directive" emerg at startup).
        location ~ "^/t/[a-z0-9][a-z0-9-]{0,62}(/(bracket|schedule|teampath|buckets|standings))?$" {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Admin page — access controlled by session auth (API routes require a
        # valid session; the page itself shows a login overlay until authenticated).
        location = /admin {
            try_files /admin.html =404;
        }

        location = /admin.html {
            try_files $uri =404;
        }

        # Bracket Builder — admin tool (same session-auth model as /admin).
        location = /builder {
            try_files /builder.html =404;
        }

        location = /builder.html {
            try_files $uri =404;
        }

        # Scorekeeper mode — results/admin tool (same session-auth model as /admin).
        location = /score {
            try_files /score.html =404;
        }

        location = /score.html {
            try_files $uri =404;
        }

        # Lineup page — served to coaches via magic-link redirect
        location = /lineup {
            try_files /lineup.html =404;
        }

        # Service worker files — no-cache so updates are picked up immediately.
        # Service-Worker-Allowed: / lets the SW control the full origin scope.
        # NOTE: any add_header in a location stops it inheriting the
        # server-level headers, so the security set is repeated here (and in
        # the manifest block below) — don't remove it.
        location ~* sw\.js$ {
            add_header Service-Worker-Allowed /;
            add_header Cache-Control "no-cache";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:;" always;
            try_files $uri =404;
        }

        # Public PWA manifest + icon — served by the API so the uploaded
        # tournament logo/name brand the installed app (exact-match beats
        # the regex block below, which keeps admin-manifest.json static).
        location = /manifest.json {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location = /pwa-icon.png {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Browser-tab icon (favicon). Per-tournament, so the scoped form is
        # matched too. Regex QUOTED — an unquoted {0,62} is read as an nginx
        # block and crashes the config on boot (see the /t/ location above).
        location ~ "^(/t/[a-z0-9][a-z0-9-]{0,62})?/tab-icon\.png$" {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Admin PWA manifest — static, short-lived cache. Security headers
        # repeated: a local add_header cancels server-level inheritance.
        location ~* manifest\.json$ {
            add_header Cache-Control "no-cache";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:;" always;
            try_files $uri =404;
        }

        # Block direct browser navigation to raw source files.
        # Sub-resource loads (Sec-Fetch-Dest: style/script/font/…) are allowed.
        #
        # no-cache (revalidate, don't skip the request) because these files
        # have no content hash in their names. Without it browsers apply
        # HEURISTIC caching, and since the admin pages are deliberately NOT
        # service-worker cached, a fresh admin.html would load against a
        # stale admin.js — new markup driving old handlers, which fails in
        # ways that look like broken features rather than a stale asset.
        # The files are small and same-origin, so revalidation is cheap.
        # NOTE: any add_header here stops inheritance of the server-level
        # security headers, so they are repeated (see the sw.js block).
        location ~* \.(css|js|map)$ {
            if ($is_direct_nav) {
                return 403;
            }
            add_header Cache-Control "no-cache";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:;" always;
            try_files $uri =404;
        }

        # Everything else — SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
